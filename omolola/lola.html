<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width= initial-scale=1.0">
    <title>Document</title>
    <style>
        table {
            border-collapse: collapse;
            margin: 50px auto;
            width: 90%;
        }

        td {
            border: 1px solid pink;
            text-align: center;
            padding: 15px;
            font-size: 16px;
        }
    </style>
</head>

            <td>6</td>
            <td>7</td>
            <td>8</td>

            <td>10</td>
        </tr>
    </table>

</body>

</html>
