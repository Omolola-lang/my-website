<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/app.css">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        a {
            text-decoration: none;
        }

        .container {
            text-align: center;
            align-items: center;
            flex-wrap: wrap;
            max-width: 1000px;
            margin: 0 auto;
            padding: 15px;
        }

        .container h4 {
            color: orangered;
            font-size: 18px;
            margin-bottom: 20px;
        }
        .container .formgroup input{
            width: 100%;
            padding: 8px;
        }
    </style>
</head>

<body>
    <!-- navbar -->
    <nav class="navbar">
        <div class="container">
            <a href="" class="logo">comfort's provision store </a>


            <div class="business">
                <div class="links-container">
                    <a href="../index.html" class="links">Home</a>
                    <a href="about.html" class="links">About</a>
                    <a href="contact.html" class="links active">contact</a>
                </div>
                <a href="" class="btn">Shop Now</a>
            </div>

        </div>

        </div>


        </div>

    </nav>


    <div class="container">
        <h4>Send Us a Message</h4>

        <form>
            <div class="formgroup">
                <p class="label">Name</p>
                <input type="Name" placeholder="Your Name">

            </div>
            <div class="formgroup">
                <p class="label">Email</p>
                <input type="Email" placeholder="Your Email">

            </div>
            <div class="formgroup">
                <p class="label">Number</p>
                <input type="Number" placeholder="Phone Number">

            </div>
            <div class="formgroup">
                <p class="label">Message</p>
                <input type="Message" placeholder="Your Message">

            </div>


        </form>
        <a href="" class="btn">Send Message</a>
    </div>





</body>

</html>
